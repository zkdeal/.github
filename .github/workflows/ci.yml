name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-readme:
    name: Profile README
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require a non-empty organization profile
        run: test -s profile/Readme.md

      - name: Lint organization profile Markdown
        run: npx --yes markdownlint-cli@0.45.0 profile/Readme.md --disable MD013
